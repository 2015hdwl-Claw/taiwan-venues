<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>活動大師 EventMaster - 台灣活動場地查詢平台</title>
    <meta name="description" content="快速找到最適合的活動場地。526 個場地資料，免費查詢，專業諮詢。">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="logo">
                <h1>🎭 活動大師 EventMaster</h1>
                <p class="tagline">找場地，問 EM 就夠了！</p>
            </div>
            <nav class="nav">
                <a href="#search" class="nav-link">找場地</a>
                <a href="#submit-demand" class="nav-link btn btn-primary">提交需求</a>
            </nav>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <div class="container">
            <h2>快速找到最適合的活動場地</h2>
            <p class="hero-desc">免費查詢 371 個場地，專業諮詢，節省您的寶貴時間</p>
            
            <!-- Quick Search -->
            <div class="quick-search">
                <input type="text" id="heroSearch" placeholder="輸入場地名稱、地點或關鍵字...">
                <button onclick="quickSearch()" class="btn btn-primary">搜尋</button>
            </div>

            <!-- Quick Stats -->
            <div class="quick-stats">
                <div class="stat-item">
                    <span class="stat-number">371</span>
                    <span class="stat-label">個場地</span>
                </div>
                <div class="stat-item">
                    <span class="stat-number">22</span>
                    <span class="stat-label">個縣市</span>
                </div>
                <div class="stat-item">
                    <span class="stat-number">100%</span>
                    <span class="stat-label">免費查詢</span>
                </div>
            </div>
        </div>
    </section>

    <!-- Search Section -->
    <section id="search" class="search-section">
        <div class="container">
            <!-- Filters -->
            <div class="filters">
                <div class="filter-group">
                    <label>縣市</label>
                    <select id="cityFilter" onchange="applyFilters()">
                        <option value="">全部縣市</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>場地類型</label>
                    <select id="typeFilter" onchange="applyFilters()">
                        <option value="">全部類型</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>容納人數</label>
                    <select id="capacityFilter" onchange="applyFilters()">
                        <option value="">不限</option>
                        <option value="50">50 人以下</option>
                        <option value="100">100 人以下</option>
                        <option value="200">200 人以下</option>
                        <option value="500">500 人以下</option>
                        <option value="500+">500 人以上</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>預算（半天）</label>
                    <select id="priceFilter" onchange="applyFilters()">
                        <option value="">不限</option>
                        <option value="10000">1 萬以下</option>
                        <option value="30000">3 萬以下</option>
                        <option value="50000">5 萬以下</option>
                        <option value="100000">10 萬以下</option>
                        <option value="100000+">10 萬以上</option>
                    </select>
                </div>
            </div>

            <!-- Results Count -->
            <div class="results-info">
                <span id="resultsCount">載入中...</span>
                <button onclick="resetFilters()" class="btn btn-secondary btn-sm">重設篩選</button>
            </div>

            <!-- Venues Grid -->
            <div id="venuesGrid" class="venues-grid">
                <!-- 場地卡片會在這裡動態生成 -->
            </div>
        </div>
    </section>

    <!-- Submit Demand Section -->
    <section id="submit-demand" class="submit-section">
        <div class="container">
            <h2>📝 提交您的需求</h2>
            <p class="section-desc">告訴我們您的活動需求，我們會為您推薦最適合的場地</p>
            
            <form id="demandForm" class="demand-form" onsubmit="submitDemand(event)">
                <div class="form-row">
                    <div class="form-group">
                        <label>活動類型 *</label>
                        <select id="eventType" required>
                            <option value="">請選擇</option>
                            <option value="會議">會議 / 講座</option>
                            <option value="培訓">培訓 / 工作坊</option>
                            <option value="宴會">宴會 / 尾牙</option>
                            <option value="婚禮">婚禮</option>
                            <option value="展演">展演 / 發表會</option>
                            <option value="其他">其他</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>預計人數 *</label>
                        <select id="eventCapacity" required>
                            <option value="">請選擇</option>
                            <option value="20">20 人以下</option>
                            <option value="50">20-50 人</option>
                            <option value="100">50-100 人</option>
                            <option value="200">100-200 人</option>
                            <option value="500">200-500 人</option>
                            <option value="500+">500 人以上</option>
                        </select>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label>預算範圍（半天）</label>
                        <select id="eventBudget">
                            <option value="">不確定</option>
                            <option value="10000">1 萬以下</option>
                            <option value="30000">1-3 萬</option>
                            <option value="50000">3-5 萬</option>
                            <option value="100000">5-10 萬</option>
                            <option value="100000+">10 萬以上</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>偏好縣市</label>
                        <select id="eventCity">
                            <option value="">不限</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>活動日期（可選）</label>
                    <input type="date" id="eventDate">
                </div>

                <div class="form-group">
                    <label>其他需求或備註</label>
                    <textarea id="eventNote" rows="3" placeholder="例如：需要投影設備、音響、餐飲服務..."></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>您的姓名 *</label>
                        <input type="text" id="contactName" required>
                    </div>
                    <div class="form-group">
                        <label>聯絡電話 *</label>
                        <input type="tel" id="contactPhone" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Email *</label>
                    <input type="email" id="contactEmail" required>
                </div>

                <button type="submit" class="btn btn-primary btn-lg">送出需求</button>
            </form>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>© 2026 活動大師 EventMaster. All rights reserved.</p>
            <p>聯絡我們：eventmaster@example.com</p>
        </div>
    </footer>

    <!-- Venue Detail Modal -->
    <div id="venueModal" class="modal" style="display: none;">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div id="venueDetail"></div>
        </div>
    </div>

    <!-- Success Modal -->
    <div id="successModal" class="modal" style="display: none;">
        <div class="modal-content success-content">
            <h3>✅ 需求已送出！</h3>
            <p>我們會在 24 小時內與您聯繫</p>
            <button onclick="closeSuccessModal()" class="btn btn-primary">確定</button>
        </div>
    </div>

    <script src="venues-data.js"></script>
    <script src="app.js"></script>
</body>
</html>
